function hgFonts(){if(hgFontsC)return hgFontsC;const o=[];for(const ss of document.styleSheets){let r;try{r=ss.cssRules}catch(_){continue}for(const x of r)if(x.type===5)o.push({w:x.style.getPropertyValue("font-weight"),src:x.style.getPropertyValue("src")})}return hgFontsC=o}
function hgTheme(){const c=getComputedStyle(document.documentElement),g=k=>c.getPropertyValue(k).trim();return{c:g("--c"),hot:g("--hot"),tx:g("--tx"),dm:g("--dm"),cr:g("--cr")}}
function hgState(){let k="",p="";try{k=kv().k||""}catch(_){}try{p=pnm||""}catch(_){}return{n:cur,monster:k,preset:p,on:st===2,hunt:!!hunt,hold:!!hold,scenes:(typeof HGS==="object"&&HGS?hgSceneNames():[]),lair:!!(typeof HGS==="object"&&HGS&&HGS.lair),party:(typeof HGP==="object"&&HGP?HGP.list.map(c=>c.name):[])}}
function hgPost(m){if(!HGB.fr||!HGB.ok)return;try{HGB.fr.contentWindow.postMessage(Object.assign({src:"hg-face",v:2},m),hgOrig())}catch(_){}}
function hgEmit(kind,data){if(HGB&&HGB.ok)hgPost({cmd:"event",kind,data,t:Date.now()})}
var hgBox=document.createElement("div");hgBox.id="hgbook";hgBox.setAttribute("role","dialog");hgBox.setAttribute("aria-label","THE BOOK");hgBox.innerHTML='<button class="hx" aria-label="BACK TO THE TABLE">×</button><div class="nf" hidden></div>';document.body.appendChild(hgBox);
var hgNF=hgBox.querySelector(".nf");hgBox.querySelector(".hx").onclick=()=>hgBookClose();
function hgBookOpen(){if(!HGB.fr){const f=document.createElement("iframe");f.title="THE BOOK";f.setAttribute("allow","clipboard-write");HGB.fr=f;hgBox.appendChild(f);hgBox.classList.add("nr");
  HGB.to=setTimeout(()=>{if(!HGB.ok){hgNF.textContent="THE BOOK DID NOT OPEN · RELOAD THE PAGE";hgNF.hidden=false}},5000);if(HG_BOOK)f.srcdoc=new TextDecoder().decode(Uint8Array.from(atob(HG_BOOK),c=>c.charCodeAt(0)));else f.src=HGB.f}
 hgBox.classList.add("on");try{HGB.fr.focus()}catch(_){}if(HGB.ok)hgPost({cmd:"state",state:hgState()})}
function hgBookClose(){hgBox.classList.remove("on");try{window.focus()}catch(_){}}
var hgTabB=document.createElement("button");hgTabB.textContent="BOOK";hgTabB.className="hgtb";hgTabB.setAttribute("aria-label","OPEN THE BOOK: NOTES, ENTRIES, FILES, DICE. THE SOUND KEEPS PLAYING");hgTabB.onclick=hgBookOpen;$("#tb").appendChild(hgTabB);
addEventListener("keydown",e=>{if(e.key==="Escape"&&hgBox.classList.contains("on")){e.preventDefault();e.stopImmediatePropagation();hgBookClose()}},true);
/* SUMMON changes the monster only (picture, voice, calls), not the patch: a KAIJU-BLUE preset change ends held notes (measured), and at the table the music should carry on when a monster appears. SET THE SOUND is the patch change. */
function hgSummon(n){n=n|0;if(n<1||n>25)return false;const i=ord.indexOf(n);if(i>=0)bi=i;plate(n);toast("MONSTER "+p2(n)+((KV[n]&&KV[n].k)?" · "+KV[n].k:""));return true}
function hgPreset(name){name=String(name||"").toUpperCase();name=HG_POLD[name]||name;const i=PRE0.findIndex(p=>p.n===name);if(i<0)return false;pi=i;hgCarryDo(()=>setP(PRE0[i]));toast(p2(i+1)+"/"+PRE0.length+" "+PRE0[i].n);return true}
addEventListener("message",e=>{const d=e.data;if(!d||d.src!=="hg-tool"||typeof d.cmd!=="string")return;if(!HGB.fr||e.source!==HGB.fr.contentWindow)return;if(hgOrig()!=="*"&&e.origin!==location.origin)return;
 if(d.cmd==="hello"){HGB.ok=true;clearTimeout(HGB.to);hgBox.classList.remove("nr");hgNF.hidden=true;let pads=[],mons=[],pres=[];try{pads=HT.map(h=>h[0])}catch(_){}try{for(let n=1;n<=25;n++)mons.push({n,name:(KV[n]&&KV[n].k)||""})}catch(_){}try{pres=PRE0.map(p=>p.n)}catch(_){}
  hgPost({cmd:"welcome",theme:hgTheme(),fonts:hgFonts(),pads,monsters:mons,presets:pres,state:hgState()});return}
 if(!HGB.ok)return;
 if(d.cmd==="close"){hgBookClose();return}
 if(d.cmd==="state-req"){hgPost({cmd:"state",state:hgState()});return}
 if(d.cmd==="log"){hgEmit("log",{text:String(d.text||"").slice(0,160)});return}
 if(st!==2||!ready){hgPost({cmd:"off"});return}
 if(d.cmd==="pad"){let hi=-1;try{hi=HT.findIndex(h=>h[0]===String(d.pad||"").toUpperCase())}catch(_){}if(hi>=0)hitK(hi)}
 else if(d.cmd==="monster"){hgSummon(d.n)}
 else if(d.cmd==="preset"){hgPreset(d.name)}
 else if(d.cmd==="hold"){setHold(!hold)}
 else if(d.cmd==="panic"){panic()}
 else if(d.cmd==="clock"){if(d.op==="adv")ckAdvance();else if(d.op==="reset")ckReset();else if(d.op==="size")ckSize()}
 else if(d.cmd==="polish"){const m=POLM.findIndex(x=>x[0]===String(d.mode||"").toUpperCase());if(m>=0)hgPolSet(m)}
 else if(d.cmd==="turn"){HGP.turn=String(d.name||"").slice(0,40);hgPartyDraw()}
 else if(d.cmd==="link"){if(d.op==="send")hgLinkSend(d.what==="map"||d.what==="breaks"?d.what:"table");else if(d.op==="watch")hgLinkWatch(!!d.on)}
 else if(d.cmd==="world"){const k=String(d.bed||"").toLowerCase();if(BEDS.some(b=>b[1]===k))wSet(k,!!d.on)}
 else if(d.cmd==="scene"){hgSceneGo((d.n|0)-1)}
 else if(d.cmd==="lair"){hgLairSet(!!d.on)}
 else return;
 hgPost({cmd:"state",state:hgState()})});

/* ═ HEARTHGLOAM · TALK ═ the game master narrates over the table's sound. HOLD the centre lane (the empty middle column where the monster is,
   between the side panels) for 0.28 s: the music dips 12 dB (attack about 0.05 s) and comes back on release (about 0.3 s). DOUBLE-TAP the lane
   to lock it down; any tap in the lane ends it. Desktop: hold the ` key. The dip is applied after the limiter (outT, and the 5.1 path when it is
   on), so it changes what the table hears, not what REC captures. A blur or a hidden page lets go of a held (not a locked) TALK. */
var hgTalkOn=0,hgTalkLatch=0,hgTalkT=0,hgTapT=0,hgPid=null,hgT6n=null,TALK_DB=(typeof TALK_DB==="number"?TALK_DB:-12);
function hgT6(d){if(!hgT6n){hgT6n=G_(1);hgT6n.channelCount=6;hgT6n.channelCountMode="explicit";hgT6n.channelInterpretation="discrete";hgT6n.connect(d)}return hgT6n}
var hgTalkEl=document.createElement("div");hgTalkEl.id="hgtalk";hgTalkEl.setAttribute("role","status");document.body.appendChild(hgTalkEl);
function hgTalk(on){on=!!on;if(on===!!hgTalkOn)return;hgTalkOn=on?1:0;if(on)hgTalkSeen=1;if(ac){const t=ac.currentTime,v=on?Math.pow(10,TALK_DB/20):1,tc=on?.05:.3;[outT,hgT6n].forEach(n=>{if(n)try{n.gain.cancelScheduledValues(t);n.gain.setTargetAtTime(v,t,tc)}catch(_){}})}
 hgTalkEl.textContent=hgTalkLatch?"TALK · LOCKED · TAP THE MONSTER TO END":"TALK · MUSIC DOWN";hgTalkEl.classList.toggle("on",on);try{hgEmit("talk",{on})}catch(_){}}
function hgInLane(e){const a=$("#app");if(e.target!==a&&e.target!==$("#lock"))return false;const r=$("#lock").getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom}
$("#app").addEventListener("pointerdown",e=>{if(st!==2||!hgInLane(e))return;if(hgTalkLatch){hgTalkLatch=0;hgTalk(0);return}const now=performance.now();
 if(now-hgTapT<330){hgTapT=0;clearTimeout(hgTalkT);hgTalkLatch=1;hgTalkOn=0;hgTalk(1);return}hgTapT=now;hgPid=e.pointerId;clearTimeout(hgTalkT);hgTalkT=setTimeout(()=>{hgTalk(1)},280)});
["pointerup","pointercancel"].forEach(t=>addEventListener(t,e=>{if(e.pointerId!==hgPid)return;hgPid=null;clearTimeout(hgTalkT);if(!hgTalkLatch)hgTalk(0)},true));
addEventListener("keydown",e=>{if(e.code==="Backquote"&&!e.repeat&&st===2&&!e.target.closest("input,textarea")){e.preventDefault();hgTalk(1)}});
addEventListener("keyup",e=>{if(e.code==="Backquote"&&!hgTalkLatch)hgTalk(0)});
addEventListener("blur",()=>{if(!hgTalkLatch)hgTalk(0)});document.addEventListener("visibilitychange",()=>{if(document.hidden&&!hgTalkLatch)hgTalk(0)});
/* the first two power-ons on a device say how to talk */
(function(){let n=0;try{n=+localStorage.getItem("hg_talkhint")||0}catch(_){}if(n>=2)return;const iv=setInterval(()=>{if(st===2&&ready){clearInterval(iv);setTimeout(()=>{toast("HOLD THE MONSTER TO TALK · FLICK IT TO CHANGE IT");try{localStorage.setItem("hg_talkhint",n+1)}catch(_){}},2600)}},1000)})();
})();
</script></body></html>
